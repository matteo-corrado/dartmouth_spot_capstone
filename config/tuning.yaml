# Measured on the robot 2026-10-28 (mic frame): FRONT 179, LEFT 89, BACK 356, RIGHT 296.
mic_yaw_offset_deg: 179.0
mic_yaw_sign: -1
# LED ring, measured on the device 2026-10-28: mic DoA and LED index both increase
# clockwise from above; LED0 is at ~12:30 relative to Spot's front.
ring_offset_leds: 6
ring_reverse: false

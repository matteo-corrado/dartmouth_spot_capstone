# Demo tunables. Every key is commented at its default; uncomment to override.
# Unknown keys are ignored with a logged warning.
mic_channel: 1   # replay 2026-10-28: wakes 11/13 vs 6/13 (fan); ASR on ch1 to verify live
# min_speech_dbfs: -50.0
min_snr_db: 6.0   # gate is p90 speech level over floor. Replay ch1: commands 6.9-13.2 dB, quick replies 12-15, fan noise utts 3.7/5.8 -> 0 drops, 0-1 noise passes/2 min (8 drops 2-3/9)
# onset_frames: 3
end_silence_s: 1.2
end_silence_s_short: 1.0
# max_utterance_s: 20.0
# floor_window_s: 5.0
# floor_percentile: 10.0
# floor_rise_db_per_s: 1.0
# reopen_delay_s: 0.5
# speaker_tail_s: 0.15
# kws_score: 1.5
# kws_threshold: 0.05
# kws_peak_target: 0.9   # wake KWS peak-safe gain target (<=0 = legacy fixed x8)
# lock_window_deg: 35.0
# lock_timeout_s: 20.0
# lock_nudge: 0.3
# Measured on the robot 2026-10-28 (mic frame): FRONT 179, LEFT 89, BACK 356, RIGHT 296.
mic_yaw_offset_deg: 179.0
mic_yaw_sign: -1
# LED ring, measured on the device 2026-10-28: mic DoA and LED index both increase
# clockwise from above; LED0 is at ~12:30 relative to Spot's front.
ring_offset_leds: 6
ring_reverse: false
# ring_max_hz: 30.0   # LED ring write cap (Hz); the animator runs at this rate
# beam_steering: false
# voiceprint_enabled: false   # TA 89.7% < 90% on replay; try live with `spotctl voiceprint on`
voiceprint_threshold: 0.35   # replay ch1: same median 0.53, other-voice 0.16 (n=2 podcast segs) -> TA 89.7% FA 3.7%; short follow-ups only 26% (0.25: 68%/FA 17%)
# thinking_filler_s: 4.0
# walk_speed_cap: 0.5
dance_clearance_m: 1.0   # operator 2026-10-29; measured from body centre (Spot is ~1.1 m long)
# mouth_lead_s: 0.0
# mouth_max_open: 0.6
# mouth_attack_s: 0.03
# mouth_release_s: 0.10
# mouth_rest_open: 0.08
# Arm (operator decisions 2026-10-28). First robot run: small gaze, then widen.
auto_arm: true       # fold the arm + mouth on once standing (--no-arm also opts out)
gaze_max_deg: 20     # shoulder-yaw gaze limit (code caps at 60; 0 = gaze off)
gaze_sh0_sign: 1     # UNVERIFIED on the robot: flip to -1 if the arm turns away from the speaker

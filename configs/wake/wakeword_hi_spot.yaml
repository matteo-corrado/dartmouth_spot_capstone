# Candidate B: "hi spot" wake word — alternate to "hey spot" (some far-field mics
# resolve the "hi" vowel more cleanly than "hey"). Synthetic positives via Piper
# VITS SLERP pool (904 speakers). Hardened against "hi scott"/"high spot" confusables.
# Train via: scripts/training/wake/sbatch_all_candidates.sh (array task 1).

data_dir: /mnt/ssd/livekit-wakeword-data

model_name: hi_spot
target_phrases:
  - "hi spot"
  - "hi, spot"

custom_negative_phrases:
  - "hi scott"
  - "hipster"
  - "high spot"
  - "hi sport"
  - "hide spot"

tts_backend: piper_vits

piper_tts:
  checkpoint_relpath: piper/en-us-libritts-high.pt

n_samples: 25000
n_samples_val: 5000
n_background_samples: 1500
n_background_samples_val: 500

augmentation:
  background_snr_min_db: 5
  background_snr_max_db: 25
  rir_prob: 0.7
  gain_min_db: -10
  gain_max_db: 6
  pitch_shift_semitones: 1.5
  time_stretch_min: 0.9
  time_stretch_max: 1.1

model:
  model_type: conv_attention
  model_size: small

steps: 50000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 1500.0
target_fp_per_hour: 0.1

batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 1024
  background_noise: 50
